<!-- todo_confirm_delete.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید حذف کار</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Vazirmatn Persian Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

    <!-- Background Decorative Gradients -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-rose-600/15 rounded-full blur-3xl"></div>
    </div>

    <main class="w-full max-w-md">
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl text-center">

            <!-- Danger Icon -->
            <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-500 shadow-lg shadow-rose-500/10">
                <i class="fa-solid fa-trash-can text-2xl"></i>
            </div>

            <h1 class="text-xl font-extrabold text-white mb-2">حذف کار</h1>
            <p class="text-sm text-slate-400 mb-6">آیا از حذف این کار اطمینان دارید؟ این عملیات قابل بازگشت نیست.</p>

            <!-- Object Preview Card -->
            <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 text-right mb-6 space-y-1">
                <span class="text-xs font-semibold text-slate-400 block">عنوان کار:</span>
                <p class="text-sm font-bold text-slate-200">{{ object.title }}</p>
            </div>

            <!-- Action Form -->
            <form method="post" action="" class="flex items-center gap-3">
                {% csrf_token %}
                <button type="submit"
                    class="flex-1 py-3.5 px-4 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-semibold text-sm rounded-2xl shadow-lg shadow-rose-500/25 transition-all duration-200">
                    بله، حذف شود
                </button>
                <a href="/"
                    class="flex-1 py-3.5 px-4 bg-slate-800 hover:bg-slate-700/80 text-slate-300 font-semibold text-sm rounded-2xl transition-all duration-200 text-center">
                    انصراف
                </a>
            </form>

        </div>
    </main>

</body>
</html>
